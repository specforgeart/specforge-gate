services:
  specforge-gate:
    build:
      context: .
      dockerfile: Dockerfile
    image: specforge-gate:local
    ports:
      - "127.0.0.1:${SPECFORGE_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
