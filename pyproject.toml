[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specforge-gate"
version = "0.3.2"
description = "Deterministic quality gate for software requirements and AI coding tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "SpecForge"}]
keywords = ["requirements", "linter", "acceptance-criteria", "github-actions", "ai-coding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
specgate = "specforge_gate.cli:main"

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.165.2,<7",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
  "twine>=5.1",
  "pre-commit>=4.0",
  "types-PyYAML>=6.0.12",
  "fastapi>=0.115,<1",
  "httpx2>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["specforge_gate"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.mutmut]
source_paths = ["src/specforge_gate/"]
do_not_mutate = [
  "src/specforge_gate/__init__.py",
  "src/specforge_gate/cli.py",
  "src/specforge_gate/github_action.py",
  "src/specforge_gate/api.py",
  "src/specforge_gate/web_ui.py",
  "src/specforge_gate/ai/__init__.py",
  "src/specforge_gate/ai/provider.py",
  "src/specforge_gate/ai/ollama.py",
  "src/specforge_gate/ai/openai_compatible.py",
  "src/specforge_gate/ai/contradictions.py",
  "src/specforge_gate/ai/improved_draft.py",
  "src/specforge_gate/ai/runtime.py",
]
pytest_add_cli_args_test_selection = [
  "tests/test_engine.py",
  "tests/test_config.py",
  "tests/test_suppression.py",
  "tests/test_properties.py",
  "tests/test_mutation_contracts.py",
]
pytest_add_cli_args = ["-q"]
mutate_only_covered_lines = true
max_stack_depth = 12
