repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: ruff check .
        language: python
        additional_dependencies:
          - ruff>=0.6
        pass_filenames: false
      - id: mypy
        name: MyPy
        entry: mypy src/specforge_gate
        language: python
        additional_dependencies:
          - mypy>=1.11
          - PyYAML>=6.0.2
          - types-PyYAML>=6.0.12
        pass_filenames: false
