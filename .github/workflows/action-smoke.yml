name: Action Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-smoke:
    name: action-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run local action on a passing specification
        id: pass
        uses: ./
        with:
          paths: examples/improved/export-task.md
          fail-on: error

      - name: Verify pass outputs
        shell: bash
        run: |
          test "${{ steps.pass.outputs.status }}" = "PASS"
          test "${{ steps.pass.outputs.files }}" = "1"
          test "${{ steps.pass.outputs.total }}" = "0"

      - name: Run local action in report-only mode
        id: report-only
        uses: ./
        with:
          paths: examples/bad/export-task.md
          fail-on: none

      - name: Verify report-only outputs
        shell: bash
        run: |
          test "${{ steps.report-only.outputs.status }}" = "NEEDS WORK"
          test "${{ steps.report-only.outputs.files }}" = "1"
          test "${{ steps.report-only.outputs.errors }}" -gt "0"

      - name: Run local action on changed Markdown files
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          fail-on: none
