name: Mutation Testing

on:
  schedule:
    - cron: "43 5 * * 2"
  workflow_dispatch:
  # Temporary bootstrap trigger for the implementation PR. Remove after the measured
  # baseline is recorded in docs/mutation-baseline.md.
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/specforge_gate/**"
      - "tests/**"
      - "scripts/mutation_summary.py"
      - ".github/workflows/mutation-testing.yml"

permissions:
  contents: read

jobs:
  mutation-testing:
    name: mutation-testing
    if: github.event_name != 'pull_request' || github.head_ref == 'test/deep-deterministic-quality-gates'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and mutation tooling
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "mutmut==3.7.0"

      - name: Verify focused clean test selection
        run: |
          python -m pytest \
            tests/test_engine.py \
            tests/test_config.py \
            tests/test_suppression.py \
            tests/test_properties.py \
            tests/test_mutation_contracts.py

      - name: Run mutation testing
        id: mutmut
        continue-on-error: true
        run: |
          rm -rf mutants mutation-results.txt mutation-summary.json
          mutmut run --max-children 4

      - name: Capture mutmut results
        if: always()
        run: mutmut results | tee mutation-results.txt || true

      - name: Capture surviving mutant diffs
        if: always()
        shell: bash
        run: |
          : > mutation-survivor-diffs.txt
          awk '/: survived$/ {
            line=$0
            sub(/^[[:space:]]+/, "", line)
            sub(/: survived$/, "", line)
            print line
          }' mutation-results.txt > mutation-survivors.txt

          apply_failures=0
          while IFS= read -r mutant; do
            [ -n "$mutant" ] || continue
            echo "===== $mutant =====" >> mutation-survivor-diffs.txt
            if mutmut apply "$mutant"; then
              git diff --no-ext-diff --unified=3 -- src/specforge_gate \
                >> mutation-survivor-diffs.txt
            else
              echo "ERROR: mutmut apply failed for $mutant" >> mutation-survivor-diffs.txt
              apply_failures=$((apply_failures + 1))
            fi
            echo >> mutation-survivor-diffs.txt
            git restore --source=HEAD --worktree --staged -- src/specforge_gate
          done < mutation-survivors.txt

          git diff --exit-code -- src/specforge_gate
          cat mutation-survivor-diffs.txt
          test "$apply_failures" -eq 0

      - name: Summarize and verify completed mutation run
        if: always()
        run: |
          python scripts/mutation_summary.py \
            --mutants mutants \
            --results mutation-results.txt \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --output mutation-summary.json \
            --require-complete
