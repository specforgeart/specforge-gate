name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-package:
    name: static-package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]" twine

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/specforge_gate

      - name: Package
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Install built wheel and smoke-test CLI
        shell: bash
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install dist/*.whl
          .venv-smoke/bin/specgate --help

  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test with branch coverage
        run: pytest --cov=specforge_gate --cov-branch --cov-report=term-missing --cov-fail-under=85

  ci-gate:
    name: ci-gate
    if: always()
    needs: [static-package, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify required CI jobs
        env:
          STATIC_PACKAGE_RESULT: ${{ needs.static-package.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          test "$STATIC_PACKAGE_RESULT" = "success"
          test "$TESTS_RESULT" = "success"
