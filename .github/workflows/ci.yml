name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-package:
    name: static-package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Canonical Linux quality
        env:
          SKIP_HOOKS: "1"
          PYTHON: python
        run: |
          bash scripts/bootstrap.sh
          bash scripts/check.sh

  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test with branch coverage
        run: pytest --cov=specforge_gate --cov-branch --cov-report=term-missing --cov-fail-under=85

  container-smoke:
    name: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build and start container
        run: docker compose up --build -d --wait --wait-timeout 60

      - name: Verify container contract
        run: |
          test "$(docker compose exec -T specforge-gate id -u)" = "10001"
          curl --fail --silent --show-error http://127.0.0.1:8000/healthz | grep '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1:8000/ | grep -F 'SpecForge Gate'
          response="$(curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"text":"Need it fast."}' \
            http://127.0.0.1:8000/v1/check)"
          printf '%s' "$response" | grep -F '"status":"NEEDS WORK"'

      - name: Tear down container
        if: always()
        run: docker compose down --remove-orphans

  ci-gate:
    name: ci-gate
    if: always()
    needs: [static-package, tests, container-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify required CI jobs
        env:
          STATIC_PACKAGE_RESULT: ${{ needs.static-package.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          CONTAINER_SMOKE_RESULT: ${{ needs.container-smoke.result }}
        run: |
          test "$STATIC_PACKAGE_RESULT" = "success"
          test "$TESTS_RESULT" = "success"
          test "$CONTAINER_SMOKE_RESULT" = "success"
