name: SpecForge Gate

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - ".specgate.yml"

permissions:
  contents: read

jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: specforgeart/specforge-gate@main
        with:
          fail-on: error
